<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MunchMaar QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#fff7ed;--tx:#1f2937;--ac:#ea580c}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--tx:#f5f5f4}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;text-align:center;padding:30px 16px}
h1{margin:6px 0 0;font-size:34px}
.s{color:var(--ac);font-weight:700;margin:4px 0 20px}
#qr{display:inline-block;background:#fff;padding:18px;border-radius:16px}
p{opacity:.7;font-size:14px;word-break:break-all}
</style></head><body>
<div style="font-size:56px">🍬🍫</div>
<h1>MunchMaar</h1>
<div class="s">Tap. Pay. Khaao.</div>
<div id="qr"></div>
<p>Scan to open the app<br><span id="u"></span></p>
<script>
var site=new URL('./',location.href).href;
document.getElementById('u').textContent=site;
new QRCode(document.getElementById('qr'),{text:site,width:240,height:240,correctLevel:QRCode.CorrectLevel.M});
</script>
</body></html>
